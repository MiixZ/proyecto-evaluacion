services:
  # ============================================================
  # Sandbox Images (solo construyen las imágenes)
  # ============================================================
  sandbox-python:
    build:
      context: ./execution-engine/sandboxes/python
      dockerfile: Dockerfile
    image: codeeval-sandbox-python:latest
    container_name: codeeval-sandbox-python-builder
    command: echo "Python sandbox image built successfully"
    restart: "no"
    profiles: ["build-sandboxes"]

  sandbox-java:
    build:
      context: ./execution-engine/sandboxes/java
      dockerfile: Dockerfile
    image: codeeval-sandbox-java:latest
    container_name: codeeval-sandbox-java-builder
    command: echo "Java sandbox image built successfully"
    restart: "no"
    profiles: ["build-sandboxes"]

  sandbox-javascript:
    build:
      context: ./execution-engine/sandboxes/javascript
      dockerfile: Dockerfile
    image: codeeval-sandbox-javascript:latest
    container_name: codeeval-sandbox-javascript-builder
    command: echo "JavaScript sandbox image built successfully"
    restart: "no"
    profiles: ["build-sandboxes"]

  sandbox-cpp:
    build:
      context: ./execution-engine/sandboxes/cpp
      dockerfile: Dockerfile
    image: codeeval-sandbox-cpp:latest
    container_name: codeeval-sandbox-cpp-builder
    command: echo "C++ sandbox image built successfully"
    restart: "no"
    profiles: ["build-sandboxes"]

  # ============================================================
  # MySQL Database
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: codeeval_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_INITDB_SKIP_TZINFO: 1
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
      - ./database/mysql.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - codeeval-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=500
      - --max_allowed_packet=256M

  # ============================================================
  # phpMyAdmin
  # ============================================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: codeeval-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      PMA_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${PHPMYADMIN_PORT}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - codeeval-net

  # ============================================================
  # Backend API
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codeeval-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      EXECUTION_ENGINE_URL: http://execution-engine:3001
      EXECUTION_ENGINE_API_KEY: ${EXECUTION_ENGINE_API_KEY}
      CORS_ORIGIN: http://localhost:8081
      JWT_SECRET: ${JWT_SECRET:-secret_default_para_pruebas}
      JWT_EXPIRY: 7d
      PORT: 4000
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - codeeval-net
      - codeeval-ext-net
    volumes:
      - ./backend/src:/app/src

  # ============================================================
  # Execution Engine (capa de ejecución)
  # ============================================================
  execution-engine:
    build:
      context: ./execution-engine
      dockerfile: Dockerfile
    container_name: codeeval-execution-engine
    environment:
      NODE_ENV: production
      EXECUTION_ENGINE_API_KEY: ${EXECUTION_ENGINE_API_KEY}
      DOCKER_SOCKET: /var/run/docker.sock
      SANDBOX_VOLUME_NAME: codeeval-shared-vol
      SANDBOX_IMAGE_PYTHON: python:3.9-slim
      SANDBOX_IMAGE_JAVA: openjdk:17-slim
      SANDBOX_IMAGE_JAVASCRIPT: node:18-alpine
      SANDBOX_IMAGE_CPP: gcc:12-alpine
    ports:
      - "3001:3001"
    networks:
      - codeeval-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./src:/app/src
      - codeeval-shared-vol:/app/sandbox_data
    privileged: true

  # ============================================================
  # Frontend (NUEVO)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://codeeval.miixzify.es/api
    container_name: codeeval-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - codeeval-net
      - codeeval-ext-net

networks:
  codeeval-net:
    driver: bridge
  codeeval-ext-net:
    driver: bridge
volumes:
  mysql_data:
    driver: local
  codeeval-shared-vol:
    name: codeeval-shared-vol
